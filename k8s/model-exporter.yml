apiVersion: v1
kind: Pod
metadata:
  name: bank-model-exporter
  namespace: spark-jobs
spec:
  restartPolicy: Never
  containers:
    - name: exporter
      image: busybox:1.36
      command:
        - sh
        - -c
        - sleep 3600
      volumeMounts:
        - name: model-volume
          mountPath: /models
          readOnly: true
  volumes:
    - name: model-volume
      persistentVolumeClaim:
        claimName: bank-models
        readOnly: true
